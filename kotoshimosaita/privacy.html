<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f7f5ef"><title>プライバシーポリシー｜今年も咲いた</title><meta name="description" content="今年も咲いたのプライバシーポリシーです。"><style> :root{color-scheme:light dark;--bg:#f7f5ef;--fg:#28352d;--muted:#5b665f;--link:#285d47;--line:#d9ded7} @media(prefers-color-scheme:dark){:root{--bg:#171d19;--fg:#e9eee9;--muted:#b6c0b8;--link:#a2d9b4;--line:#39443c}}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:17px/1.8 -apple-system,BlinkMacSystemFont,"Hiragino Sans",sans-serif}main{max-width:780px;margin:auto;padding:clamp(24px,6vw,64px) 22px 48px}h1,h2,h3{line-height:1.35}h1{font-size:clamp(28px,5vw,38px);margin:0 0 10px}h2{font-size:22px;margin-top:38px;border-top:1px solid var(--line);padding-top:18px}p,li{max-width:70ch}a{color:var(--link);text-underline-offset:3px}small,.muted{color:var(--muted)}nav{border-top:1px solid var(--line);margin-top:40px;padding-top:18px}</head><body><main><h1>プライバシーポリシー</h1><p class="muted">対象アプリ：今年も咲いた<br>制定日・最終更新日：2026年10月8日</p>
<h2>1. アプリで扱う情報</h2><p>植物名、つぼみ・開花・花終わり・植替の日付、開花回などの記録と、利用者が選んだ写真を扱います。記録は端末内のアプリ領域に保存し、写真は保存時に最大辺1,800ピクセルのJPEGへ変換します。アカウント登録はありません。植物の記録や写真を運営者のサーバーへ送信する機能はありません。</p><p>広告表示のためGoogle Mobile Ads SDKとGoogle User Messaging Platform（UMP）を利用します。広告は、初回の記録保存後に設定画面の下部で表示する設計です。記録・写真・比較画面には表示しません。広告の読み込みには、SDKが必要とする情報がGoogleへ送信される場合があります。</p>
<h2>2. バックアップ、外部保存、削除</h2><p>アプリから写真を含むJSONバックアップを書き出し、選んだバックアップを復元できます。写真の合計上限は40MB、バックアップファイルの上限は64MBです。バックアップは暗号化されません。ファイルアプリやクラウドストレージなど、利用者が選んだ保存先での保護・同期・保持には各サービスの規約とプライバシー方針が適用されます。復元すると現在の記録が置き換わります。アプリ内で記録を削除すると関連する写真も削除されます。アプリを削除すると端末内のデータが失われる場合があります。別途書き出したバックアップは保存先に残ります。</p>
<h2>3. 広告・第三者サービス</h2><p>Googleの<a href="https://developers.google.com/admob/ios/privacy/data-disclosure" rel="noopener">App Store向けデータ開示</a>では、Google Mobile Ads SDKがIPアドレス、クラッシュ情報、性能情報、端末識別子、広告データ、製品操作情報などを扱う場合があると説明されています。開示内容はSDKの版や設定により異なり、同ページの説明対象版と本アプリに組み込んだSDKの版が同一とは限りません。アプリに同梱されるプライバシーマニフェストの宣言だけで実際の通信・利用を確定できるものではありません。</p><p>UMPを通じて、地域や設定に応じて同意情報の更新、プライバシー選択肢の提示を行います。詳しくはGoogleの<a href="https://developers.google.com/admob/ios/privacy" rel="noopener">UMPプライバシーガイド</a>をご覧ください。広告の提供状況やデータ処理は、地域、同意状態、設定、SDKの更新によって変わることがあります。植物記録・写真を広告SDKへ渡す設計ではありません。</p>
<h2>4. 購入</h2><p>広告削除の買い切り商品は300円で提供予定です。購入・復元はAppleのApp Storeを通じて処理されます。利用可能な商品や請求内容は購入画面に表示される情報をご確認ください。</p>
<h2>5. お問い合わせ</h2><p>アプリ内「設定とお問い合わせ」からメールを作成できます。メールの本文や添付は利用者が内容を確認し、選んだメールサービスを通じて送信します。アプリは送信内容を取得しません。プライバシーに関するお問い合わせは<a href="mailto:shimazakihibiki.youtu@gmail.com">サポート窓口</a>へご連絡ください。</p>
<h2>6. ポリシーの変更</h2><p>機能や利用するサービスの変更に応じて本ポリシーを改定します。変更後の内容はこのページに掲載します。</p><nav><a href="support.html">サポート</a> · <a href="privacy.html">プライバシーポリシー</a></nav></main></body></html>
