  <meta name="theme-color" content="#f8f4f0">
  <title>IdeaSnap — リンクとアイデア</title>
  <style>
    :root{color-scheme:light;--ink:#252523;--muted:#696762;--paper:#f8f4f0;--card:#fffdfa;--line:#e6ddd4;--accent:#d96458}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic UI",Meiryo,sans-serif;line-height:1.75}main{max-width:760px;margin:auto;padding:28px 22px 64px}.mark{display:inline-flex;align-items:center;gap:10px;font-weight:750;letter-spacing:.02em}.symbol{width:38px;height:38px;border-radius:13px;background:var(--accent);display:grid;place-items:center;color:white;font-size:21px}.hero{padding:76px 0 44px}h1{font-size:clamp(2.2rem,8vw,4rem);line-height:1.16;letter-spacing:-.045em;margin:0 0 18px}p{margin:.4em 0;color:var(--muted)}.lead{font-size:1.15rem;max-width:580px}.links{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px;margin-top:32px}.links a{display:flex;justify-content:space-between;align-items:center;padding:17px 18px;background:var(--card);border:1px solid var(--line);border-radius:16px;color:var(--ink);text-decoration:none;font-weight:650}.links a:hover{border-color:var(--accent)}.arrow{color:var(--accent)}footer{border-top:1px solid var(--line);margin-top:70px;padding-top:20px;font-size:.85rem;color:var(--muted)}
  </style>
</head>
<body><main>
  <div class="mark"><span class="symbol" aria-hidden="true">✳</span><span>IdeaSnap</span></div>
  <section class="hero"><h1>気になったものを、<br>あとで見返せる場所へ。</h1><p class="lead">リンクや文章、画像を保存して、自分のリストにまとめるアプリです。ひとりで使う保存機能はアカウント登録なしで利用できます。</p>

    </nav>
  </section>
  <footer>IdeaSnap — リンクとアイデア</footer>
